<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JNFAM Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: sticky top bar · report column + summary rail · IPS board stacks TOR/EHS → SIC table → projects → actions */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --surface2:#F7F8F6; --line:#E1E4DF; --line2:#EEF0EC;
  --ink:#18211D; --ink2:#3D4842; --muted:#5B6560;
  --main:#1D4F91; --main-soft:#EEF2F8; --on-main:#FFFFFF;
  --sub:#B4530E; --sub-soft:#FDF1E7; --sub-ink:#8A3D07;
  --ok:#1C6B3D; --ok-soft:#E4F1E8; --warn:#8A5A00; --warn-soft:#FFF3D6; --bad:#B3261E; --bad-soft:#FDECEA;
  --fb:#FFFBEF; --fb-line:#EAD9A6; --fb-ink:#7A5A00;
  --hero:#18211D; --hero-ink:#FFFFFF; --hero-muted:#C2CAC5; --hero-line:#3A4540;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111513; --surface:#1A201D; --surface2:#202724; --line:#2F3733; --line2:#262D29;
  --ink:#E7ECE8; --ink2:#C3CBC6; --muted:#98A39C;
  --main:#8DB4EC; --main-soft:#1E2A3B; --on-main:#0E1826;
  --sub:#F0A060; --sub-soft:#33251A; --sub-ink:#F3B886;
  --ok:#7FCB9A; --ok-soft:#1B2E22; --warn:#E8C26A; --warn-soft:#332A15; --bad:#F2928A; --bad-soft:#3A1F1D;
  --fb:#2A2517; --fb-line:#4D4325; --fb-ink:#E8C979;
  --hero:#0A0D0B; --hero-ink:#E7ECE8; --hero-muted:#9AA59E; --hero-line:#2A322E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A201D; --surface2:#202724; --line:#2F3733; --line2:#262D29;
  --ink:#E7ECE8; --ink2:#C3CBC6; --muted:#98A39C;
  --main:#8DB4EC; --main-soft:#1E2A3B; --on-main:#0E1826;
  --sub:#F0A060; --sub-soft:#33251A; --sub-ink:#F3B886;
  --ok:#7FCB9A; --ok-soft:#1B2E22; --warn:#E8C26A; --warn-soft:#332A15; --bad:#F2928A; --bad-soft:#3A1F1D;
  --fb:#2A2517; --fb-line:#4D4325; --fb-ink:#E8C979;
  --hero:#0A0D0B; --hero-ink:#E7ECE8; --hero-muted:#9AA59E; --hero-line:#2A322E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px}
h1{margin:4px 0 0;font-size:26px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:16.5px;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.eyebrow{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.03em}

/* top bar */
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;min-height:58px;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{width:30px;height:30px;border-radius:7px;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;flex:0 0 auto}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto}
.tab{padding:8px 12px;border-radius:6px;color:var(--ink2);background:none;border:0;cursor:pointer;min-height:38px}
.tab:hover{background:var(--surface2)}
.tab[aria-current="page"]{background:var(--main-soft);color:var(--main);font-weight:600}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.av{width:32px;height:32px;border-radius:50%;background:var(--main-soft);color:var(--main);font-weight:700;font-size:11.5px;display:grid;place-items:center;flex:0 0 auto}
.av.adm{background:var(--hero);color:var(--hero-ink);font-size:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;padding:5px 9px;background:var(--surface);color:var(--ink2);cursor:pointer;font-size:12px}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.demo{background:var(--warn-soft);color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line)}
.demo .wrap{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:6px}

main{padding-block:22px 80px}
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.page-h .meta{margin-top:6px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--main);border-color:var(--main);color:var(--on-main)}
.btn.subc{background:var(--sub);border-color:var(--sub);color:var(--on-main)}
.btn.sm{min-height:32px;padding:0 10px;font-size:12.5px}
.btn.dash{border-style:dashed;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.btn.icon{width:36px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.layout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col-main{flex:999 1 620px;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-side{flex:1 1 270px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.card.subcard{border-top:4px solid var(--sub)}
.card.pad{padding:16px 18px}
.sec-h{padding:16px 18px 10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.sec-h p{margin:3px 0 0;color:var(--muted);font-size:13px;max-width:66ch}
.sec-n{font-family:var(--mono);color:var(--muted);margin-right:8px;font-weight:500}
.sec-f{padding:10px 18px 16px;border-top:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scroll{overflow-x:auto}
.row{display:grid;gap:10px;align-items:center;padding:9px 18px;border-top:1px solid var(--line2)}
.row.hd{background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted);padding-block:7px}
.empty{padding:14px 18px;border-top:1px solid var(--line2);color:var(--muted);font-size:13px}
.in{width:100%;min-height:36px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:13.5px}
textarea.in{min-height:76px;resize:vertical;line-height:1.5}
.in:disabled{background:var(--surface2);color:var(--ink2)}
.in::placeholder{color:var(--muted);opacity:.85}
input[type=range]{width:100%;accent-color:var(--main)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--main)}
label.ck{display:flex;gap:8px;align-items:center;cursor:pointer}

.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.6}
.t-main{background:var(--main-soft);color:var(--main)} .t-sub{background:var(--sub-soft);color:var(--sub-ink)}
.t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)}
.t-bad{background:var(--bad-soft);color:var(--bad)} .t-neutral{background:var(--surface2);color:var(--ink2);border:1px solid var(--line)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.seg button{min-height:32px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap}
.seg button:hover:not(:disabled){border-color:var(--muted)}
.seg button[aria-pressed="true"]{font-weight:700}
.seg button[aria-pressed="true"].ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"].warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.seg button[aria-pressed="true"].bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg button[aria-pressed="true"].neutral{background:var(--surface2);border-color:var(--ink2);color:var(--ink)}
.seg button:disabled{cursor:default}

.fbbox{background:var(--fb);border:1px solid var(--fb-line);border-radius:12px;padding:16px 18px}
.fbbox .lbl{font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--fb-ink)}
.fbbox p{margin:6px 0 0;font-size:15px;line-height:1.6;max-width:70ch;white-space:pre-line}
.fbline{margin-top:6px;padding:7px 10px;border-radius:8px;background:var(--fb);border:1px solid var(--fb-line);font-size:13px}
.fbline b{color:var(--fb-ink);margin-right:4px}
.reply{margin-top:6px;padding:7px 10px;border-radius:8px;background:var(--main-soft);font-size:13px;margin-left:24px}
.reply b{color:var(--main);margin-right:4px}
.fbtools{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.fbtools .in{flex:1 1 220px;min-height:32px;font-size:13px;background:var(--fb);border-color:var(--fb-line)}

.ro{padding:10px 18px;border-top:1px solid var(--line2)}
.ro-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.ro-top .tx{flex:1 1 240px;min-width:0}
.ro-top .tx b{font-weight:600}
.ro .det{color:var(--ink2);font-size:13px}

.pj{padding:12px 18px 14px;border-top:1px solid var(--line2)}
.pj-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.pj-top .tt{font-weight:600;flex:1 1 220px;min-width:0}
.pj-grid{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pj-grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:600}
.dd{font-family:var(--mono);font-size:12px;font-weight:600}
.dd.late{color:var(--bad)} .dd.soon{color:var(--warn)} .dd.fine{color:var(--ink2)}

.prompts{margin:6px 18px 16px;padding:12px 14px;border-radius:10px;background:var(--surface2)}
.prompts .g{margin-top:8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px}
.prompt{display:flex;gap:8px;align-items:center;text-align:left;min-height:36px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;color:var(--ink2)}
.prompt:hover{border-color:var(--sub)}
.prompt .tag{margin-left:auto}

.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px;margin-top:10px}
.stat .v{font-family:var(--mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--main);border-radius:4px}
.bar.sub>i{background:var(--sub)}
.checks{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .ic{font-weight:700;width:14px;flex:0 0 auto}
.checks .ok{color:var(--ok)} .checks .no{color:var(--warn)}
.spark{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:84px;margin-top:12px}
.spark div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:84px}
.spark i{display:block;width:100%;max-width:24px;border-radius:3px 3px 0 0;background:var(--sub-soft);border:1px solid var(--sub)}
.spark i.cur{background:var(--sub)}
.spark span{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.spark-x{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:4px}

.warnbox{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:12px 14px}
.warnbox ul{margin:6px 0 10px;padding-left:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}

/* people cards */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.pcard{display:block;text-align:left;width:100%;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.pcard[aria-pressed="true"]{border:2px solid var(--main);padding:13px 15px}
.pcard .hd{display:flex;align-items:center;gap:10px}
.pcard .nm{flex:1 1 auto;line-height:1.3;min-width:0}
.pcard .nm b{display:block}
.pcard .nums{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pcard .nums .v{font-family:var(--mono);font-size:18px;font-weight:600}
.pcard .nums .k{font-size:11px;color:var(--muted)}

/* history list */
.wklist{flex:1 1 250px;min-width:0;overflow:hidden;padding:0}
.wkbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 16px;border:0;border-top:1px solid var(--line2);background:var(--surface);text-align:left;cursor:pointer}
.wkbtn:first-child{border-top:0}
.wkbtn[aria-current="true"]{background:var(--main-soft);box-shadow:inset 3px 0 0 var(--main)}
.wkbtn .w{font-family:var(--mono);font-weight:600;width:40px}
.wkbtn .r{flex:1 1 auto;font-size:13px;color:var(--ink2)}

/* IPS */
.tor{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:12px 0 0;padding:0;list-style:none}
.tor li{padding:10px 12px;border-radius:8px;background:var(--surface2)}
.tor .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tor b{display:block;margin-top:2px}
.tor .w{font-size:12px;color:var(--ink2)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:12px;padding:16px 18px}
.hero .m{color:var(--hero-muted)}
.ehs{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) 78px 78px;gap:10px 12px;align-items:end}
.ehs .big{font-family:var(--mono);font-size:30px;font-weight:600;text-align:right;line-height:1.1}
.ehs .rec{font-family:var(--mono);font-size:17px;text-align:right;color:var(--hero-muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.cell{text-align:center;padding:5px 2px;border-radius:5px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-bad{background:var(--bad-soft);color:var(--bad)} .c-na{background:var(--surface2);color:var(--muted);border-color:var(--line2)}
.c-cur{border:2px solid currentColor;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
.dot.auto{background:var(--main)} .dot.man{border:1.5px solid var(--muted)}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding-block:40px}
.login-card{width:100%;max-width:960px;display:flex;flex-wrap:wrap;overflow:hidden;border-radius:16px}
.login-l{flex:1 1 340px;min-width:0;padding:40px 36px;border-radius:0;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.login-l h1{font-size:28px;line-height:1.35;margin-top:30px}
.login-l .steps{display:flex;flex-direction:column;gap:9px;font-size:13px}
.login-l .steps span{font-family:var(--mono);margin-right:10px}
.login-r{flex:1 1 400px;min-width:0;padding:40px 36px;display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ubtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;min-height:60px}
.ubtn[aria-pressed="true"]{border:2px solid var(--main);background:var(--main-soft);padding:11px 13px}
.ubtn .r{font-size:12px;color:var(--muted);display:block}
.pin{font-family:var(--mono);font-size:20px;letter-spacing:.4em;min-height:48px}
.err{color:var(--bad);font-size:13px;font-weight:600}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;font-weight:600;max-width:calc(100% - 32px)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
'use strict';

/* ───────── 배포 설정 ─────────
   Firebase Realtime Database를 쓰려면 아래 null 대신 Firebase 콘솔의 config 객체(databaseURL 포함)를 넣으세요.
   데이터는 /weekly 경로 아래에 저장됩니다.
   null이면 이 브라우저에만 저장되는 로컬 데모 모드로 동작합니다. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBkY5IGIPC0CsJB55hui7wqCffcCiS33NI",
  authDomain: "jnfam-task-plan.firebaseapp.com",
  databaseURL: "https://jnfam-task-plan-default-rtdb.firebaseio.com",
  projectId: "jnfam-task-plan",
  storageBucket: "jnfam-task-plan.firebasestorage.app",
  messagingSenderId: "76859256151",
  appId: "1:76859256151:web:c056fd641305780908e212"
};
const FB_VER = '10.12.2';
const DB_ROOT = 'weekly';
const LS_KEY = 'jnfam_weekly_v1';
const COLS = ['users','reports','routines','projects','actions','settings'];

let DB = {users:{},reports:{},routines:{},projects:{},actions:{},settings:{}};
let FS = null;
const S = {uid:null, view:'report', wk:null, sel:null, histWk:null, tasksUid:null, dashWk:null,
  lang:'ko', confirm:null, nf:{proj:{kind:'main',cat:'etc'}, ac:{}}, showProj:false, fb:null,
  submitWarn:false, draft:null, loginPick:null, loginErr:'', ready:false};
try{ S.lang = localStorage.getItem('wr_lang') || 'ko'; }catch(e){}
try{ S.uid = sessionStorage.getItem('wr_uid'); }catch(e){}

const L = (ko,en) => S.lang==='en' ? en : ko;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = p => (p||'') + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const $ = s => document.querySelector(s);

/* ───────── 날짜 · ISO 주차 ───────── */
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function parseD(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); if(!y) return null; return new Date(y,m-1,d); }
function wkKey(d){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(); const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7); return y+'-W'+pad(w); }
function wkMon(key){ const y=+key.slice(0,4), w=+key.slice(6); const j4=new Date(y,0,4); const dd=j4.getDay()||7; return new Date(y,0,4-dd+1+(w-1)*7); }
function wkDay(key,i){ const m=wkMon(key); return new Date(m.getFullYear(),m.getMonth(),m.getDate()+i); }
function addWk(key,n){ return wkKey(wkDay(key,7*n)); }
const wkLabel = key => (+key.slice(6))+'W';
const md = d => (d.getMonth()+1)+'/'+d.getDate();
const wkRange = key => md(wkDay(key,0))+' – '+md(wkDay(key,4));
const DOW = {ko:['일','월','화','수','목','금','토'], en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']};
const dow = d => DOW[S.lang==='en'?'en':'ko'][d.getDay()];
function fmtDate(s){ const d=parseD(s); return d ? md(d)+' '+dow(d) : ''; }
function today0(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function dday(s){ const d=parseD(s); return d ? Math.round((d-today0())/864e5) : null; }
function ddLabel(n){ if(n===null) return '—'; if(n===0) return 'D-day'; return n>0 ? 'D-'+n : 'D+'+(-n); }
function ddCls(n){ if(n===null) return 'fine'; if(n<0) return 'late'; if(n<=7) return 'soon'; return 'fine'; }
function wkEnd(key){ const d=wkDay(key,6); d.setHours(23,59,59,0); return d; }
function dueOf(key){ const st=settings(); const d=wkDay(key,(+st.dueDay||5)-1); d.setHours(+st.dueHour||18,0,0,0); return d; }
function wksBetween(a,b){ return Math.round((wkMon(b)-wkMon(a))/(7*864e5)); }
const curWk = () => wkKey(new Date());
function hm(ts){ const d=new Date(ts); return md(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ───────── 저장소 (Firebase Realtime Database · /weekly 경로) ───────── */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function normalize(){
  COLS.forEach(c=>{ DB[c]=DB[c]||{}; });
  Object.values(DB.reports).forEach(r=>{
    ['extra','subs','nextPlan','routineIds'].forEach(k=>{ const v=r[k]; r[k]=Array.isArray(v)?v.filter(Boolean):(v&&typeof v==='object'?Object.values(v):[]); });
    ['planCheck','routineLog','projectLog'].forEach(k=>{ r[k]=r[k]||{}; });
    if(r.feedback){ r.feedback.items=r.feedback.items||{}; r.feedback.good=r.feedback.good||{}; }
  });
}
async function storeInit(){
  if(FIREBASE_CONFIG){
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
    const app = firebase.apps.find(a=>a.name==='weekly') || firebase.initializeApp(FIREBASE_CONFIG,'weekly');
    FS = app.database().ref(DB_ROOT);
    await refreshAll();
    if(!Object.keys(DB.users).length){
      const seed = seedEmpty();
      for(const c of COLS) for(const o of Object.values(seed[c])) await put(c,o);
    }
  } else {
    let saved=null;
    try{ saved = JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
    DB = (saved && saved.users) ? saved : seedDemo();
    normalize(); persistLocal();
  }
}
async function refreshAll(){
  if(!FS) return;
  const snap = await FS.once('value');
  DB = snap.val() || {};
  normalize();
}
function persistLocal(){ if(FS) return; try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
function put(col,obj){
  DB[col][obj.id]=obj;
  if(FS) return FS.child(col).child(obj.id).set(clone(obj)).catch(()=>toast(L('저장 실패 · 인터넷 연결 또는 권한을 확인하세요','Save failed · check connection or permissions')));
  persistLocal();
}
function del(col,id){
  delete DB[col][id];
  if(FS) return FS.child(col).child(id).remove().catch(()=>toast(L('삭제 실패','Delete failed')));
  persistLocal();
}
const timers={};
function saveLater(col,obj){
  DB[col][obj.id]=obj;
  clearTimeout(timers[col+obj.id]);
  timers[col+obj.id]=setTimeout(()=>{ put(col,obj); const n=$('#savedNote'); if(n) n.textContent=L('저장됨 ','Saved ')+hm(Date.now()).split(' ')[1]; },600);
}

const byCreated = (a,b)=>(a.createdAt||0)-(b.createdAt||0);
function routineDue(r,wk){
  if(r.freq==='biweekly') return ((wksBetween(r.startWk||wk,wk))%2+2)%2===0;
  if(r.freq==='monthly'){ const dm=+r.monthDay||1; for(let i=0;i<7;i++) if(wkDay(wk,i).getDate()===dm) return true; return false; }
  return true;
}
function routinesFor(uid,wk){ return Object.values(DB.routines).filter(r=>r.uid===uid && r.active!==false && (!r.startWk||r.startWk<=wk) && routineDue(r,wk)).sort(byCreated); }
function projectsFor(uid,wk){
  return Object.values(DB.projects).filter(p=>p.uid===uid && (!p.startWk||p.startWk<=wk) && (p.status!=='done' || (p.doneWk && p.doneWk>=wk)))
    .sort((a,b)=>(a.target||'9999').localeCompare(b.target||'9999'));
}
function prevPlan(r){ const p=rep(r.uid,addWk(r.wk,-1)); return (p?.nextPlan||[]).filter(x=>x.text); }
function routineIdsOf(r){ return r.routineIds || routinesFor(r.uid,r.wk).map(x=>x.id); }
function repStats(r){
  if(!r) return null;
  const plan=prevPlan(r); const pDone=plan.filter(p=>r.planCheck?.[p.id]?.s==='done').length;
  const ids=routineIdsOf(r); const rs=ids.reduce((a,id)=>a+({done:1,partial:.5}[r.routineLog?.[id]?.s]||0),0);
  const subN=(r.subs||[]).filter(s=>s.text).length;
  const ehsN=(r.subs||[]).filter(s=>s.text&&s.cat==='ehs').length;
  const mainN=pDone + ids.filter(id=>DB.routines[id]?.kind!=='sub' && ['done','partial'].includes(r.routineLog?.[id]?.s)).length + (r.extra||[]).filter(x=>x.text).length;
  return { planTotal:plan.length, pDone, planRate: plan.length? Math.round(pDone/plan.length*100) : null,
    rTotal:ids.length, routineRate: ids.length? Math.round(rs/ids.length*100) : null, subN, ehsN, mainN };
}
function repStatus(r){
  if(!r) return [L('미작성','Not started'),'t-neutral'];
  if(r.status==='reviewed') return [L('피드백 완료','Reviewed'),'t-ok'];
  if(r.status==='submitted') return [L('제출됨','Submitted'),'t-main'];
  if(r.returned) return [L('보완 요청','Returned'),'t-bad'];
  return [L('작성 중','Draft'),'t-warn'];
}
function keyTitle(r,key){
  const i=key.indexOf(':'); const t=i<0?key:key.slice(0,i), id=key.slice(i+1);
  if(t==='plan') return prevPlan(r).find(x=>x.id===id)?.text||'';
  if(t==='rt') return DB.routines[id]?.title||'';
  if(t==='pj') return DB.projects[id]?.title||'';

  if(t==='sub') return (r.subs||[]).find(x=>x.id===id)?.text||'';
  if(t==='issue') return L('이슈 · 도움 요청','Issues · help');
  return '';
}

function scopeObj(scope){

  switch(t){
    case 'r': return [S.draft,'reports'];

function setPath(o,path,v){ const ks=path.split('.'); let c=o; for(let i=0;i<ks.length-1;i++){ if(c[ks[i]]==null||typeof c[ks[i]]!=='object') c[ks[i]]={}; c=c[ks[i]]; } c[ks[ks.length-1]]=v; }
function onBind(el,isChange){
  const [o,col]=scopeObj(el.dataset.s); if(!o) return;
  let v = el.type==='checkbox' ? el.checked : el.value;
  if(el.dataset.num!==undefined) v = v==='' ? null : Number(v);
  const k=el.dataset.k;
  setPath(o,k,v);
  if(col==='projects'){
    if(k==='status'){ if(v==='done'){ o.doneAt=Date.now(); o.doneWk=curWk(); if((o.progress||0)<100) o.progress=100; } else { delete o.doneAt; delete o.doneWk; } }
    if(k==='start' && parseD(v)) o.startWk=wkKey(parseD(v));
  }
  if((col==='routines'||col==='projects') && k==='kind') o.cat = v==='sub' ? 'clean' : 'etc';
  if(el.dataset.s==='nf' && k==='proj.kind') S.nf.proj.cat = v==='sub' ? 'clean' : 'etc';
  if(el.dataset.out){ const t=document.getElementById(el.dataset.out); if(t) t.textContent=v+'%'; }
  if(col) saveLater(col,o);
  if(isChange && el.dataset.rr!==undefined) render();
}
document.addEventListener('input',e=>{ const el=e.target; if(el.dataset && el.dataset.k && el.type!=='checkbox' && el.tagName!=='SELECT') onBind(el,false); });

function submitIssues(r){
  const out=[]; const st=settings();
  const plan=prevPlan(r); const miss=plan.filter(p=>!r.planCheck?.[p.id]?.s).length;
  if(miss) out.push(L(`지난주 계획 ${miss}건 결과 미선택`,`${miss} plan item(s) without a result`));
  const rs=routinesFor(r.uid,r.wk).filter(x=>!r.routineLog?.[x.id]?.s).length;
  if(rs) out.push(L(`루틴 ${rs}건 수행 여부 미선택`,`${rs} routine(s) not marked`));
  const ps=projectsFor(r.uid,r.wk).filter(p=>p.status==='open' && !(r.projectLog?.[p.id]?.update||'').trim()).length;
  if(ps) out.push(L(`장기 업무 ${ps}건 이번 주 진행 내용 없음`,`${ps} long-term item(s) without an update`));
  const sn=(r.subs||[]).filter(s=>s.text).length; const tgt=+st.targets?.subPer||2;
  if(sn<tgt) out.push(L(`Sub work ${sn}건 · 목표 ${tgt}건 이상`,`Sub work ${sn} · target ${tgt}+`));

/* ───────── 읽기 전용 보고서 (리뷰 · 이력) ───────── */
function fbSlot(key,title,mode,r){
  if(mode==='review'){
    const v=S.fb.items?.[key]||''; const g=!!S.fb.good?.[key];
    return `<div class="fbtools">
      <button type="button" class="btn sm ${g?'on':''}" data-act="good" data-key="${esc(key)}" aria-pressed="${g}">${L('좋음','Good')}</button>
      <input class="in" data-s="fb" data-k="items.${esc(key)}" value="${esc(v)}" placeholder="${L('코멘트','Comment')}" aria-label="${L('코멘트','Comment')}">
      <button type="button" class="btn sm" data-act="act-from" data-key="${esc(key)}" data-title="${esc(title)}">${L('Action 등록','Add action')}</button></div>`;
  }
  const f=r.feedback; if(!f) return '';
  const t=f.items?.[key]; const g=f.good?.[key]; if(!t&&!g) return '';
  return `<div class="fbline"><b>${esc(f.by||'CEO')}</b>${g?`<span class="tag t-ok">${L('좋음','Good')}</span> `:''}${esc(t||'')}</div>`;
}
function stTag(map,k){ if(!map[k]) return `<span class="tag t-neutral">${L('미선택','Not set')}</span>`; const cls={ok:'t-ok',warn:'t-warn',bad:'t-bad',neutral:'t-neutral'}[map[k][2]]; return `<span class="tag ${cls}">${L(map[k][0],map[k][1])}</span>`; }
function renderRO(r,mode){
  const plan=prevPlan(r); const ids=routineIdsOf(r);
  const pjIds=Object.keys(r.projectLog||{}).filter(id=>DB.projects[id]);
  const sec=(title,inner,extra='')=>`<div class="sec-h" style="border-top:1px solid var(--line2);padding-top:14px"><h3>${title}</h3>${extra}</div>${inner}`;
  const none=`<div class="empty">${L('없음','None')}</div>`;
  let h='';
  h+=sec(L('지난주 계획 점검','LAST WEEK’S PLAN'), plan.length?plan.map(p=>{const pc=r.planCheck?.[p.id]||{};return `<div class="ro"><div class="ro-top"><span class="mono small muted" style="width:64px">${esc(fmtDate(p.date))}</span>${stTag(PLAN_S,pc.s)}<span class="tx"><b>${esc(p.text)}</b>${pc.note?` <span class="det">· ${esc(pc.note)}</span>`:''}</span></div>${fbSlot('plan:'+p.id,p.text,mode,r)}</div>`}).join(''):none, `<span class="mono small">${plan.filter(p=>r.planCheck?.[p.id]?.s==='done').length} / ${plan.length}</span>`);
  h+=sec(L('루틴','ROUTINES'), ids.length?ids.map(id=>{const x=DB.routines[id]; if(!x) return ''; const lg=r.routineLog?.[id]||{}; return `<div class="ro"><div class="ro-top">${stTag(ROUT_S,lg.s)}${kindTag(x.kind,x.cat)}<span class="tx"><b>${esc(x.title)}</b>${lg.note?` <span class="det">· ${esc(lg.note)}</span>`:''}</span></div>${fbSlot('rt:'+id,x.title,mode,r)}</div>`}).join(''):none);
  h+=sec(L('장기 업무','LONG-TERM WORK'), pjIds.length?pjIds.map(id=>{const p=DB.projects[id]; const lg=r.projectLog[id]; const n=dday(p.target); return `<div class="ro"><div class="ro-top">${stTag(HEALTH,lg.health)}<span class="tx"><b>${esc(p.title)}</b> <span class="mono small">${lg.progress??p.progress??0}%</span></span><span class="dd ${p.status==='done'?'fine':ddCls(n)}">${esc(fmtDate(p.target))} · ${p.status==='done'?L('완료','Done'):ddLabel(n)}</span></div>
     <div class="det" style="margin-top:3px">${lg.update?esc(lg.update):`<span class="muted">${L('진행 내용 없음','No update')}</span>`}${lg.next?` → ${esc(lg.next)}`:''}</div>
     <div class="bar" style="margin-top:6px;max-width:320px" aria-hidden="true"><i style="width:${lg.progress??p.progress??0}%"></i></div>${fbSlot('pj:'+id,p.title,mode,r)}</div>`}).join(''):none);
  const ex=(r.extra||[]).filter(x=>x.text);
  h+=sec(L('계획 외 Main work','UNPLANNED MAIN WORK'), ex.length?ex.map(x=>`<div class="ro"><div class="ro-top">${kindTag('main',x.cat)}<span class="tx"><b>${esc(x.text)}</b>${x.detail?` <span class="det">· ${esc(x.detail)}</span>`:''}</span></div>${fbSlot('ex:'+x.id,x.text,mode,r)}</div>`).join(''):none);
  const sb=(r.subs||[]).filter(x=>x.text);
  h+=sec(`<span style="color:var(--sub)">SUB WORK · ${sb.length}</span>`, sb.length?sb.map(x=>`<div class="ro"><div class="ro-top">${kindTag('sub',x.cat)}<span class="tx"><b>${esc(x.text)}</b>${x.detail?` <span class="det">· ${esc(x.detail)}</span>`:''}</span></div>${fbSlot('sub:'+x.id,x.text,mode,r)}</div>`).join(''):none);
  const np=(r.nextPlan||[]).filter(x=>x.text);
  h+=sec(L('다음 주 계획','NEXT WEEK PLAN'), np.length?np.map(x=>`<div class="ro"><div class="ro-top"><span class="mono small muted" style="width:64px">${esc(fmtDate(x.date))||'—'}</span>${kTag(x.kind)}<span class="tx">${esc(x.text)}${x.carried?` <span class="tag t-warn">${L('이월','Carried')}</span>`:''}</span></div></div>`).join(''):none);
  h+=sec(L('이슈 · 도움 요청','ISSUES · HELP'), `<div class="ro">${r.help?`<span class="tag t-bad">${L('도움 요청','Help needed')}</span> `:''}${r.issues?`<span style="white-space:pre-line">${esc(r.issues)}</span>`:`<span class="muted">${L('없음','None')}</span>`}${fbSlot('issue',L('이슈','Issues'),mode,r)}</div>`);
  return h;
}

function sicRows(weeks){
  const st=settings(); const T=st.targets||{}; const ppl=staff(); const cw=curWk();
  const allWks=Object.values(DB.reports).map(r=>r.wk); const first=allWks.length?allWks.reduce((a,b)=>a<b?a:b):cw;
  const live = w => w>=first && w<=cw;
  const subd = w => ppl.map(p=>rep(p.id,w)).filter(r=>r&&r.status!=='draft');
  const rows=[];
  rows.push({name:L('주간 보고 기한 내 제출','On-time weekly reports'),owner:L('팀','Team'),uom:'%',plan:'100',lo:100,hi:100,fmt:'%',auto:true,
    vals:weeks.map(w=>{ if(!live(w)||!ppl.length) return null; if(w===cw && Date.now()<dueOf(w).getTime()) return null; const n=ppl.filter(p=>{const r=rep(p.id,w); return r&&r.submittedAt&&r.submittedAt<=dueOf(w).getTime();}).length; return Math.round(n/ppl.length*100); })});
  ppl.forEach(p=>rows.push({name:L('지난주 계획 이행률','Plan completion')+' · '+p.name,owner:p.name,uom:'%',plan:`${T.planMin??85} – 100`,lo:+(T.planMin??85),hi:100,fmt:'%',auto:true,
    vals:weeks.map(w=>{const r=rep(p.id,w); if(!r||r.status==='draft') return null; return repStats(r).planRate;})}));
  ppl.forEach(p=>rows.push({name:L('루틴 수행률','Routine completion')+' · '+p.name,owner:p.name,uom:'%',plan:`${T.routineMin??90} – 100`,lo:+(T.routineMin??90),hi:100,fmt:'%',auto:true,
    vals:weeks.map(w=>{const r=rep(p.id,w); if(!r||r.status==='draft') return null; return repStats(r).routineRate;})}));
  const subTgt=(+T.subPer||2)*ppl.length;
  rows.push({name:L('Sub work 발굴 · 팀 합계','Sub work found · team'),owner:L('팀','Team'),uom:'#',plan:'≥ '+subTgt,lo:subTgt,hi:1e9,fmt:'',auto:true,
    vals:weeks.map(w=>{const rs=subd(w); if(!rs.length) return null; return rs.reduce((a,r)=>a+(r.subs||[]).filter(s=>s.text).length,0);})});
  rows.push({name:L('EHS Sub work','EHS sub work'),owner:L('팀','Team'),uom:'#',plan:'≥ '+(+T.ehsMin||1),lo:+T.ehsMin||1,hi:1e9,fmt:'',auto:true,
    vals:weeks.map(w=>{const rs=subd(w); if(!rs.length) return null; return rs.reduce((a,r)=>a+(r.subs||[]).filter(s=>s.text&&s.cat==='ehs').length,0);})});
  const asOf = w => { const e=wkEnd(w); const t=new Date(); return e<t?e:t; };
  rows.push({name:L('목표일 초과 장기 업무','Overdue long-term items'),owner:L('팀','Team'),uom:'#',plan:'0',lo:0,hi:0,fmt:'',auto:true,
    vals:weeks.map(w=>{ if(!live(w)) return null; const t=asOf(w); return Object.values(DB.projects).filter(p=>p.status!=='hold'&&(!p.startWk||p.startWk<=w)&&p.target&&parseD(p.target)<new Date(t.getFullYear(),t.getMonth(),t.getDate())&&!(p.status==='done'&&p.doneAt&&p.doneAt<=t.getTime())).length; })});
  rows.push({name:L('기한 초과 Action','Overdue actions'),owner:L('팀','Team'),uom:'#',plan:'0',lo:0,hi:0,fmt:'',auto:true,
    vals:weeks.map(w=>{ if(!live(w)) return null; const t=asOf(w); return Object.values(DB.actions).filter(a=>a.due&&parseD(a.due)<new Date(t.getFullYear(),t.getMonth(),t.getDate())&&(a.createdAt||0)<=t.getTime()&&!(a.status==='done'&&a.doneAt&&a.doneAt<=t.getTime())).length; })});
  return rows;
}

function newAction(title,owner,due,source){
  const nums=Object.values(DB.actions).map(a=>+String(a.no||'').replace(/\D/g,'')||0);
  const no='A-'+String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');
  const ac={id:newId('ac_'),no,title,owner,due,source,status:'open',createdAt:Date.now()};
  put('actions',ac); return ac;
}
function doSubmit(){
  const r=S.draft; const u=me();
  r.routineIds=routinesFor(u.id,r.wk).map(x=>x.id);
  for(const p of projectsFor(u.id,r.wk)){
    const lg=r.projectLog?.[p.id];
    if(lg && lg.progress!=null && p.status!=='done'){ p.progress=lg.progress; if(lg.progress>=100){ p.status='done'; p.doneAt=Date.now(); p.doneWk=r.wk; } put('projects',p); }
  }
  r.status='submitted'; r.submittedAt=Date.now(); r.returned=false;
  put('reports',r); S.submitWarn=false; toast(L('제출했습니다','Submitted')); render(); window.scrollTo(0,0);
}
function focusLast(arr){ setTimeout(()=>{ const els=document.querySelectorAll(`[data-s="r"][data-k^="${arr}."][data-k$=".text"]`); els[els.length-1]?.focus(); },0); }
function focusLastIn(q){ setTimeout(()=>document.querySelector(q)?.focus(),0); }
function importFile(el){
  const f=el.files?.[0]; if(!f) return; const rd=new FileReader();
  rd.onload=async()=>{ try{ const data=JSON.parse(rd.result); if(!data.users) throw 0; COLS.forEach(c=>data[c]=data[c]||{});
      if(FS){ await FS.set(clone(data)); await refreshAll(); } else { DB=data; normalize(); persistLocal(); }
      toast(L('복원했습니다','Restored')); render(); }catch(e){ toast(L('올바른 백업 파일이 아닙니다','Not a valid backup file')); } };
  rd.readAsText(f);
}

  const a=document.activeElement; const keep=a&&a.dataset&&a.dataset.k?[a.dataset.s,a.dataset.k]:null;
  const u=me();
  if(!S.wk) S.wk=curWk(); if(!S.dashWk) S.dashWk=curWk();
  const allowed=u.admin?['review','dash','tasks','admin']:['report','tasks','history','dash'];
  if(!allowed.includes(S.view)) S.view=allowed[0];

  const EXTRA={u_js:[[],[],[['prod','HF ISO 충진 · 토요일 OT','1회 · 6h']]],u_mw:[[],[['ship','HF 14 containers 입고 대응','하역 인력 조정']],[]],u_tk:[[['sales','CPA 계약 조건 협의','finalize on agreement']],[],[]]};
  const FB={
    u_js:[{overall:'BCS 청소 좋습니다. 청소 범위를 사진으로 남겨주세요.'},{overall:'벨로우즈 장착 수고했습니다. 교체 주기도 정해봅시다.'},
          {overall:'ESF IBC DIP 작업은 소요 시간도 같이 적어주세요. 출하 준비 공수 파악에 필요합니다.',sub:'Scrubber 점검 주기를 정해서 루틴으로 등록해 주세요.'}],
    u_mw:[{overall:'통로 정리 좋습니다.'},{overall:'이번 주 Sub work가 없습니다. 창고 쪽에서 하나씩 찾아봅시다.'},
          {overall:'Empty IBC 배출이 목표일을 넘겼습니다. 이번 주에 일정 확정해 주세요.'}],
    u_tk:[{overall:'CPA 계약 조건 정리 좋습니다.'},{overall:'ICP-MS 교육 준비 좋습니다.'},null]
  };
  ['u_js','u_mw','u_tk'].forEach(uid=>{
    let prevNP=[];
    for(let w=0;w<3;w++){
      const wk=addWk(cw,w-3); const nwk=addWk(wk,1);
      const r={id:uid+'_'+wk,uid,wk,status:'submitted',planCheck:{},routineLog:{},projectLog:{},extra:[],subs:[],nextPlan:[],issues:'',help:false,createdAt:now};
      prevNP.forEach((p,i)=>{ const lt=LATE[uid]?.[w]; r.planCheck[p.id]= lt&&lt[0]===i ? {s:lt[1],note:lt[2]} : {s:'done',note:''}; if(lt&&lt[0]===i) r.nextPlan.push({id:'c_'+p.id,date:'',text:p.text,kind:p.kind,carried:true}); });
      const rts=Object.values(db.routines).filter(x=>x.uid===uid&&x.startWk<=wk&&(x.freq!=='biweekly'||wksBetween(x.startWk,wk)%2===0)&&(x.freq!=='monthly'||[...Array(7)].some((_,i)=>wkDay(wk,i).getDate()===x.monthDay)));
      r.routineIds=rts.map(x=>x.id);
      rts.forEach((x,i)=>{ r.routineLog[x.id]={s:(w===1&&i===rts.length-1)?'partial':'done',note:x.cat==='ship'?['4회','5회','6회'][w]:x.cat==='prod'?['4회','4회','5회'][w]:''}; });
      Object.entries(pj).forEach(([k,id])=>{ const p=db.projects[id]; if(p.uid!==uid||p.startWk>wk) return; const txt=PJU[k][w]; if(!txt) return; r.projectLog[id]={progress:Math.max(0,p.progress-(2-w)*(k==='clean'?0:10)),update:txt,next:'',health:k==='ibc'&&w===2?'risk':k==='clean'?'risk':'ok'}; });
      (SUBS[uid][w]||[]).forEach(s=>r.subs.push({id:'s'+(++seq),cat:s[0],text:s[1],detail:s[2]}));
      (EXTRA[uid][w]||[]).forEach(s=>r.extra.push({id:'x'+(++seq),cat:s[0],text:s[1],detail:s[2]}));
      NP[uid][w].forEach(n=>r.nextPlan.push({id:'n'+(++seq),date:ymd(wkDay(nwk,n[0])),text:n[1],kind:n[2]}));
      if(uid==='u_mw'&&w===2){ r.issues='HF 14 containers 입고 주간에 하역 인력이 부족했습니다. 다음 대량 입고 때 임시 인력 검토 필요.'; r.help=true; }
      const sub=wkDay(wk,4); sub.setHours(uid==='u_tk'&&w===0?20:16,30,0,0); if(uid==='u_tk'&&w===0) sub.setDate(sub.getDate()+3); r.submittedAt=sub.getTime();
      const f=FB[uid][w];
      if(f){ r.status='reviewed'; r.feedback={overall:f.overall,items:{},good:{},by:'CEO',at:r.submittedAt+2.7*864e5};
        if(f.sub){ const s=r.subs[0]; if(s){ r.feedback.items['sub:'+s.id]=f.sub; r.feedback.good['sub:'+s.id]=true; } }
        if(w<2) r.ackAt=r.feedback.at+36e5; }
      db.reports[r.id]=r; prevNP=r.nextPlan;
    }
  });
  const A=(no,title,owner,dueOff,src,status)=>{ const d=new Date(today0()); d.setDate(d.getDate()+dueOff); const id='ac_'+no; db.actions[id]={id,no:'A-'+no,title,owner,due:ymd(d),source:src,status,createdAt:now-10*864e5,doneAt:status==='done'?now-2*864e5:undefined}; };
  A('001','Scrubber 점검 주기 확정 → 루틴 등록','u_js',1,`${wkLabel(addWk(cw,-1))} JS 보고 피드백`,'open');
  A('002','Empty IBC 120EA 배출 일정 확정','u_mw',-3,`${wkLabel(addWk(cw,-1))} 회의`,'open');
  A('003','3rd party ICP-MS 후보 3곳 비교표','u_tk',9,`${wkLabel(addWk(cw,-1))} TK 보고`,'open');
  A('004','HCl drum 라벨 제거 완료 확인','u_js',-6,`${wkLabel(addWk(cw,-2))} 회의`,'done');
  db.settings.main=Object.assign(defaultSettings(),{safety:{text:'HF 충진 노즐 분리 전 잔압 확인',who:'JS'}});
  return db;
}

render();
storeInit().then(()=>{ S.ready=true; render(); }).catch(err=>{ $('#app').innerHTML=`<div class="wrap" style="padding-block:60px"><p class="err">${L('데이터를 불러오지 못했습니다. 인터넷 연결 또는 Firebase 설정을 확인하세요.','Could not load data. Check the connection or Firebase config.')}</p></div>`; console.error(err); });
})();
</script>
